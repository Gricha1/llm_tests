default_settings: null
behaviors:
  # Lily РІР‚вЂќ Р С•Р В±РЎС“РЎвЂЎР В°Р ВµРЎвЂљРЎРѓРЎРЏ (РЎвЂ Р Р†Р ВµРЎвЂљРЎвЂ№ + Р С—Р С•РЎвЂ Р ВµР В»РЎС“Р в„– Р вЂќР В¶Р ВµР С”Р В°). Р вЂ™ Unity: Behavior Type = Default
  LilyLowLevelAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: constant
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 5000  # РќР• РњР•РќРЇРўР¬: СЃС‚СЂРёРј Р¶РґС‘С‚ .onnx РєР°Р¶РґС‹Рµ N С€Р°РіРѕРІ
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 0.001
        network_settings:
          normalize: true
          hidden_units: 256
          num_layers: 3
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: null
    keep_checkpoints: 5  # РќР• РњР•РќРЇРўР¬: 0 СЃСЂР°Р·Сѓ СѓРґР°Р»СЏРµС‚ .onnx РїРѕСЃР»Рµ Р·Р°РїРёСЃРё
    even_checkpoints: false
    max_steps: 10000000  # betaв†’0 Рє 10M; LR constant
    time_horizon: 256
    summary_freq: 50000
    threaded: false
    self_play: null
    behavioral_cloning: null
env_settings:
  env_path: null
  env_args: null
  base_port: 5005
  num_envs: 1
  num_areas: 1
  timeout_wait: 60
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 1920
  height: 1024
  quality_level: 10
  time_scale: 5
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
  no_graphics_monitor: false
environment_parameters: null
checkpoint_settings:
  run_id: lily_single_agent
  initialize_from: null
  load_model: false
  resume: false
  force: false
  train_model: true
  inference: false
  results_dir: results
torch_settings:
  device: null
