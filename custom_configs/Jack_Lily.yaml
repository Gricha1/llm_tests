default_settings: null
behaviors:
  JackLowLevelAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: constant
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 5000  # РќР• РњР•РќРЇРўР¬: СЃС‚СЂРёРј Р¶РґС‘С‚ .onnx РєР°Р¶РґС‹Рµ N С€Р°РіРѕРІ
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 0.001
        network_settings:
          normalize: true
          hidden_units: 256
          num_layers: 3
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: null
    keep_checkpoints: 5  # РќР• РњР•РќРЇРўР¬: 0 СЃСЂР°Р·Сѓ СѓРґР°Р»СЏРµС‚ .onnx РїРѕСЃР»Рµ Р·Р°РїРёСЃРё
    even_checkpoints: false
    max_steps: 10000000  # betaв†’0 Рє 10M; LR constant
    time_horizon: 256
    summary_freq: 50000
    threaded: false
    self_play: null
    behavioral_cloning: null

  LilyLowLevelAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      shared_critic: false
      learning_rate_schedule: constant
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 5000  # РќР• РњР•РќРЇРўР¬: СЃС‚СЂРёРј Р¶РґС‘С‚ .onnx РєР°Р¶РґС‹Рµ N С€Р°РіРѕРІ
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 0.001
        network_settings:
          normalize: true
          hidden_units: 256
          num_layers: 3
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
    init_path: null
    keep_checkpoints: 5  # РќР• РњР•РќРЇРўР¬: 0 СЃСЂР°Р·Сѓ СѓРґР°Р»СЏРµС‚ .onnx РїРѕСЃР»Рµ Р·Р°РїРёСЃРё
    even_checkpoints: false
    max_steps: 10000000  # betaв†’0 Рє 10M; LR constant
    time_horizon: 256
    summary_freq: 50000
    threaded: false
    self_play: null
    behavioral_cloning: null

